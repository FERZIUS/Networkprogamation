<!DOCTYPE html>
<html lang="es"
<head>
    <meta charset="UTF-8">
    <title>Registro de Articulo</title>
</head>
<body>
        <h1>Registro de Articulo</h1>
        <form>
            <label for="nombre">Nombre del Articulo:</label>
            <input type="text"id="nombreArticulo"name="nombre"required><br><br>

            <label for="serie">Número de serie:</label>
            <input type="serie"id="serie"name="serie"required><br><br>

            <label for="precio">Precio</label>
            <input type="number"id="precio"name="precio"required><br><br>
            <label for="confirmarPrecio">Confirmar precio:</label>

            <button type="submit">Registrar Articulo</button>
            <button type="submit">Cancelar</button>
        </form>
    </body>
</html>
